version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependabot"
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
    groups:
      dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: cargo
    directory: "/daemon"
    schedule:
      interval: "weekly"
    labels:
      - "dependabot"
    groups:
      dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: "/ui-web"
    schedule:
      interval: "weekly"
    labels:
      - "dependabot"
    groups:
      dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
