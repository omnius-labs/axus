version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependabot"
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
    groups:
      dependencies:
        patterns:
          - "*"
  - package-ecosystem: cargo
    directory: "/daemon"
    schedule:
      interval: "weekly"
    labels:
      - "dependabot"
    groups:
      dependencies:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: "/ui-web"
    schedule:
      interval: "weekly"
    labels:
      - "dependabot"
    ignore:
      # openapi-typescript 7.x peers typescript ^5.x; remove when it accepts 6 or later.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    groups:
      dependencies:
        patterns:
          - "*"
