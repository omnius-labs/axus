[core]
state_dir = "./state"

[api]
# The API has no authentication yet, so it must listen on a loopback address.
listen_addr = "127.0.0.1:5050"
# max_upload_size = 0 # bytes; 0 means no limit

[p2p]
listen_addr = "127.0.0.1:5051"
advertise_addrs = []
use_upnp = false
bootstrap_nodes = []

[logging]
level = "info"
json = false

