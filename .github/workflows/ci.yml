name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "main"
      - "release/*"

permissions:
  contents: read

# A new push to a pull request replaces its previous run. A run on a main branch is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which scopes a change touches, so the jobs below can skip themselves while `gate` still reports.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      ui: ${{ steps.scope.outputs.ui }}
      interface: ${{ steps.scope.outputs.interface }}
      e2e: ${{ steps.scope.outputs.e2e }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select the scopes
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          all=false
          files=""
          case "$EVENT" in
            pull_request)
              files=$(git diff --name-only "$BASE" "$GITHUB_SHA")
              ;;
            push)
              if [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                all=true
              else
                files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
              fi
              ;;
            *)
              all=true
              ;;
          esac
          if printf '%s\n' "$files" | grep -Eq '^\.github/'; then
            all=true
          fi
          echo "all scopes: $all"
          echo "changed files:"
          printf '%s\n' "$files"

          touches() {
            [ "$all" = true ] || printf '%s\n' "$files" | grep -Eq "$1"
          }
          rust=false; ui=false; interface=false
          if touches '^daemon/'; then rust=true; fi
          if touches '^(ui-web/|daemon/openapi\.yaml$)'; then ui=true; fi
          if touches '^(daemon/openapi\.yaml$|daemon/entrypoints/interface/|daemon/entrypoints/gen-interface\.sh$)'; then interface=true; fi
          e2e=false
          if [ "$rust" = true ] || [ "$ui" = true ]; then e2e=true; fi
          {
            echo "rust=$rust"
            echo "ui=$ui"
            echo "interface=$interface"
            echo "e2e=$e2e"
          } | tee -a "$GITHUB_OUTPUT"

  rust-lint:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./daemon
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: true
          remove-android: true
          remove-haskell: true

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: restore timestamps
        uses: chetan/git-restore-mtime-action@v2

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "20.1"
          directory: ${{ runner.temp }}/llvm

      - name: Setup rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Setup cargo make
        uses: davidB/rust-cargo-make@v1
        with:
          version: latest

      - name: Setup rust cache
        uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: "ubuntu-latest-lint"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: "true"
          cache-workspace-crates: "true"
          workspaces: |
            daemon -> target

      - name: Lint
        run: cargo make lint

  # A pull request runs Linux only. A main branch and a manual dispatch run every target of storage.md.
  rust-test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest","macos-latest"]') }}
    defaults:
      run:
        working-directory: ./daemon
    steps:
      - name: Maximize build space
        if: runner.os == 'Linux'
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: true
          remove-android: true
          remove-haskell: true

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: restore timestamps
        uses: chetan/git-restore-mtime-action@v2

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "20.1"
          directory: ${{ runner.temp }}/llvm

      - name: Setup rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install cargo nextest
        uses: taiki-e/install-action@nextest

      - name: Setup rust cache
        uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: "${{ matrix.os }}-test"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: "true"
          cache-workspace-crates: "true"
          workspaces: |
            daemon -> target

      # The test binary omnius-core-migration::postgres starts a Postgres container, which the Windows and macOS
      # runners cannot start. The lint is not repeated here; rust-lint runs it.
      - name: Test
        shell: bash
        env:
          NEXTEST_PROFILE: ci
        run: |
          filter=""
          if [ "$RUNNER_OS" != "Linux" ]; then
            filter="not binary_id(omnius-core-migration::postgres)"
          fi
          cargo nextest run --all-features ${filter:+-E "$filter"}

  ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./ui-web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ui-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test

  # The browser flow starts two daemons and drives the built client through them.
  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: true
          remove-android: true
          remove-haskell: true

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: restore timestamps
        uses: chetan/git-restore-mtime-action@v2

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "20.1"
          directory: ${{ runner.temp }}/llvm

      - name: Setup rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup rust cache
        uses: Swatinem/rust-cache@v2.9.3
        with:
          shared-key: "ubuntu-latest-e2e"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: "true"
          cache-workspace-crates: "true"
          workspaces: |
            daemon -> target

      - name: Build the daemon
        working-directory: ./daemon
        run: cargo build -p omnius-axus-daemon

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ui-web/package-lock.json

      - name: Install
        working-directory: ./ui-web
        run: npm ci

      - name: Cache the browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ui-web/package-lock.json') }}

      - name: Install the browser
        working-directory: ./ui-web
        run: npx playwright install --with-deps chromium

      - name: Browser flow
        working-directory: ./ui-web
        env:
          AXUS_DAEMON_BIN: ${{ github.workspace }}/daemon/target/debug/omnius-axus-daemon
        run: npm run test:e2e

      - name: Keep the trace
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: ui-web/test-results
          retention-days: 7

  # The generated Rust interface must equal the regeneration of openapi.yaml.
  interface:
    needs: changes
    if: needs.changes.outputs.interface == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: Setup java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Setup rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Regenerate
        run: bash daemon/entrypoints/gen-interface.sh

      # The generator writes the build date into the README on every run, so that line is not compared.
      - name: Compare
        run: |
          git status --short
          git diff --exit-code -- daemon/entrypoints/interface ':(exclude)daemon/entrypoints/interface/README.md'
          changed=$(git diff -U0 -- daemon/entrypoints/interface/README.md | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' | grep -v 'Build date' || true)
          if [ -n "$changed" ]; then
            echo "$changed"
            exit 1
          fi

  # A skipped job does not report, so `gate` is the only job that branch protection can require.
  gate:
    if: always()
    needs: [changes, rust-lint, rust-test, ui, e2e, interface]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
