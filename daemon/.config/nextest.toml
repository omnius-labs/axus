[test-groups]
# The integration tests below transfer files over loopback TCP with real timers. Running them all at once on a
# four-core CI runner oversubscribes the CPU and pushes the tests that wait on a transfer past their wait limit.
heavy-integration = { max-threads = 2 }

[[profile.default.overrides]]
filter = 'test(/file_exchanger::tests|service::tests|file_subscriber::store::tests/) | package(omnius-axus-daemon) & test(/server::/)'
test-group = 'heavy-integration'

# These tests assert wall-clock margins of about 100 ms, so nothing runs next to them. The test encoding 32 MiB runs
# alone for the same reason: it would use up such a margin in any test beside it.
[[profile.default.overrides]]
filter = 'test(/receive_deadline|core::session::tests::.*deadline|publications_accepts_32_mib/)'
threads-required = 'num-test-threads'
